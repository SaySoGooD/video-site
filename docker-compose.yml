# Local stack: gateway + users-service + PostgreSQL + Redis.
#
# One image serves both services — they live in the same project and differ
# only by the module they run. The gateway is the single port published to the
# host; users-service is reachable only inside the compose network, which is
# how it will sit in Kubernetes too.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-users_service}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host: a database on 0.0.0.0:5432 is how servers get
    # owned. One instance, one database per service — see the README.
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    # Rate limits and the auth cache live here. Data is disposable, so no
    # volume: a restart costs a few extra database reads, nothing more.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "6379"

  users-service:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-users_service}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SERVICE_PORT: "8001"
    expose:
      - "8001"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn users_service.bootstrap:bootstrap --factory
             --host 0.0.0.0 --port 8001"

  gateway:
    build: .
    depends_on:
      - users-service
    environment:
      GATEWAY_USERS_SERVICE_URL: http://users-service:8001
      # Set once the service exists; until then /api/v1/content answers 503.
      GATEWAY_CONTENT_SERVICE_URL: ${GATEWAY_CONTENT_SERVICE_URL:-}
      GATEWAY_CORS_ORIGINS: ${GATEWAY_CORS_ORIGINS:-[]}
      GATEWAY_TRUST_PROXY_HEADERS: ${GATEWAY_TRUST_PROXY_HEADERS:-false}
      SERVICE_PORT: "8000"
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    command: >
      uvicorn gateway.bootstrap:bootstrap --factory --host 0.0.0.0 --port 8000

volumes:
  postgres_data:
